[package]
name = "undetected-chromedriver"
version = "0.1.4"
edition = "2021"
description = "An undetected implementation of thirtyfour."
repository = "https://github.com/MustCodeAl/Rust-undetected-chromedriver"
license = "MIT"
readme = "README.md"

[dependencies]
async-trait = "0.1.*"
base64 = "0.22.*"
rand = "0.10.*"
reqwest = { version = "0.13.*", features = ["json"] }
serde_json = "1.0.*"
thirtyfour = "0.36.*"
tokio = "1.*"
zip = "8.*"
tempfile = "3.*"